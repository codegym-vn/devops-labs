<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="540" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Title -->
  <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">SO SANH DOCKERFILE: SINGLE-STAGE VS MULTI-STAGE + NON-ROOT</text>
  <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Luong bien dich, co che cache layer, toi uu dung luong va siet chat bao mat container</text>

  <!-- ===== TOP: NAIVE SINGLE-STAGE ===== -->
  <rect x="40" y="72" width="880" height="185" rx="10" fill="#ef4444" fill-opacity="0.07" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3" />
  <rect x="56" y="86" width="200" height="24" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
  <text x="66" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">NAIVE SINGLE-STAGE</text>
  <text x="270" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ef4444">Cham khi build, kich thuoc cong kenh, rui ro Root UID 0</text>

  <!-- Box 1 -->
  <rect x="56" y="120" width="240" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <rect x="56" y="120" width="240" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">1. Build Context Chua Toi Uu</text>
  <text x="70" y="162" font-family="ui-monospace, monospace" font-size="10" fill="#fca5a5">FROM golang:1.22-alpine</text>
  <text x="70" y="180" font-family="ui-monospace, monospace" font-size="10" fill="#f87171">COPY . .  (Cache Buster!)</text>
  <text x="70" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Moi lan sua code deu tai lai module</text>

  <path d="M 296 180 L 330 180" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Box 2 -->
  <rect x="336" y="120" width="250" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <rect x="336" y="120" width="250" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="350" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">2. Image Don Tang Nguyen Khoi</text>
  <text x="350" y="162" font-family="ui-monospace, monospace" font-size="10" fill="#cbd5e1">RUN go build -o server</text>
  <text x="350" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Chua toan bo Go compiler va ma nguon</text>
  <text x="350" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f87171">Be mat tan cong rong (Attack Surface)</text>

  <path d="M 586 180 L 620 180" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Box 3 -->
  <rect x="626" y="120" width="268" height="120" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
  <rect x="626" y="120" width="268" height="26" rx="8" fill="#ef4444" fill-opacity="0.2" />
  <text x="640" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">3. Runtime Kem An Toan</text>
  <text x="640" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Dung luong: <tspan fill="#f87171" font-weight="700">~350 MB</tspan></text>
  <text x="640" y="184" font-family="ui-monospace, monospace" font-size="10" fill="#f87171">USER: root (UID 0)</text>
  <text x="640" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fca5a5">Rui ro leo thang container breakout</text>

  <!-- ===== BOTTOM: PRODUCTION MULTI-STAGE ===== -->
  <rect x="40" y="275" width="880" height="245" rx="10" fill="#10b981" fill-opacity="0.07" stroke="#10b981" stroke-width="1.5" />
  <rect x="56" y="289" width="250" height="24" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="66" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">PRODUCTION MULTI-STAGE</text>
  <text x="320" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">Toi uu cache, sieu nhe (~15MB), Non-Root chuan Least Privilege</text>

  <!-- Stage 1: Builder -->
  <rect x="56" y="322" width="360" height="180" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
  <rect x="56" y="322" width="360" height="26" rx="8" fill="#0369a1" />
  <text x="70" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f0f9ff">STAGE 1: BUILDER (golang:1.22-alpine)</text>

  <rect x="70" y="358" width="332" height="22" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="78" y="373" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">1. COPY go.mod go.sum ./</text>
  <text x="300" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">[Cached]</text>

  <rect x="70" y="386" width="332" height="22" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="78" y="401" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">2. RUN go mod download</text>
  <text x="300" y="401" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">[Cached]</text>

  <rect x="70" y="414" width="332" height="22" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="78" y="429" font-family="ui-monospace, monospace" font-size="10" fill="#cbd5e1">3. COPY main.go ./</text>
  <text x="280" y="429" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fbbf24">[Chi build lai]</text>

  <rect x="70" y="442" width="332" height="22" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="78" y="457" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">4. CGO_ENABLED=0 go build -ldflags="-s -w"</text>

  <rect x="70" y="470" width="332" height="22" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="78" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Ket qua: 1 file nhi phan tinh (~8MB)</text>

  <!-- Arrow COPY --from=builder -->
  <path d="M 416 412 L 470 412" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="424" y="392" width="50" height="16" rx="3" fill="#065f46" />
  <text x="428" y="404" font-family="ui-monospace, monospace" font-size="8" fill="#a7f3d0">COPY bin</text>

  <!-- Stage 2: Runtime Hardening -->
  <rect x="476" y="322" width="418" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <rect x="476" y="322" width="418" height="26" rx="8" fill="#047857" />
  <text x="490" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ecfdf5">STAGE 2: RUNTIME HARDENING (alpine:3.19)</text>

  <text x="490" y="366" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">COPY --from=builder /app/server /app/server</text>

  <rect x="490" y="376" width="390" height="36" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
  <text x="498" y="392" font-family="ui-monospace, monospace" font-size="9" fill="#a7f3d0">RUN addgroup -g 10001 -S appgroup &amp;&amp; \</text>
  <text x="498" y="406" font-family="ui-monospace, monospace" font-size="9" fill="#a7f3d0">    adduser -u 10001 -S appuser -G appgroup</text>

  <rect x="490" y="418" width="390" height="22" rx="4" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
  <text x="498" y="433" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#34d399">USER 10001:10001 (Non-Root Enforcement)</text>

  <rect x="490" y="450" width="185" height="22" rx="3" fill="#0f172a" />
  <text x="498" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Kich thuoc: <tspan fill="#34d399" font-weight="700">~15 MB (-95%)</tspan></text>

  <rect x="685" y="450" width="195" height="22" rx="3" fill="#0f172a" />
  <text x="693" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Bao mat: <tspan fill="#38bdf8" font-weight="700">Least Privilege</tspan></text>

  <text x="490" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6ee7b7">CMD ["/app/server"]  (Exec form - nhan SIGTERM)</text>
</svg>
